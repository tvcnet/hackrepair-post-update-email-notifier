name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Syntax and behavior
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './tests/integration/*' -print0 | xargs -0 -n1 php -l
          php tests/notifications.php
          php tests/compatibility.php
          php tests/export-log.php
          php tests/updater.php
          php tests/update-notices.php
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check assets/js/admin.js
          node --check assets/js/editor.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Permission-safe package
        run: |
          python3 tests/package-permissions.py
          python3 scripts/build-release.py
  wordpress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The wp-env PHP 7.4 image no longer builds (its Debian packages return 404).
        # PHP 7.4 compatibility is covered by the php job's syntax and behavior tests.
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start WordPress
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npx --yes @wordpress/env@10 start
      - name: Integration checks
        run: npx --yes @wordpress/env@10 run cli wp eval-file wp-content/plugins/hackrepair-post-update-email-notifier/tests/integration/run.php
